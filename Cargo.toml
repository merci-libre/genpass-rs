[package]
name = "genpassrs"
authors = ["Jonathan Villanueva <westwardfishdme@gmail.com>"]
version = "2.1.0"
edition = "2021"

# debugging and benchmarking
[profile.release]
debug = true

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
clap-stdin = "0.7.0"

rand = "0.9.2"
steganography = { path = "./src/modules/steganographic/lib/steganography_update" } # used for actual image embedding

zxcvbn = "3.1.0"
console = "0.16.3"
aes = "0.8.4"
